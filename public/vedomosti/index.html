<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ВѢДОМОСТИ — Печатный двор, 1702—1727</title>
<style>
  :root{
    --paper:#ece1c8;
    --paper2:#e2d4b4;
    --plate:#f4ecd8;
    --ink:#1c1710;
    --red:#a72820;
    --red2:#8c1f18;
    --gold:#bd8c2c;
    --teal:#2b5c54;
    --faint:#7d6c4e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    background:#241b13;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(167,40,32,.35), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(189,140,44,.18), transparent 55%);
    color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    line-height:1.55;
    padding:22px 12px 70px;
    min-height:100%;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* ——— лист-таблица ——— */
  .plate{
    position:relative;background:var(--plate);
    background-image:
      radial-gradient(circle at 18% 22%, rgba(140,110,60,.10), transparent 26%),
      radial-gradient(circle at 82% 68%, rgba(140,110,60,.08), transparent 30%),
      radial-gradient(circle at 60% 90%, rgba(140,110,60,.07), transparent 24%);
    padding:30px 38px 36px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .plate:before{
    content:"";position:absolute;inset:11px;border:1px solid var(--ink);pointer-events:none;
  }
  .plate:after{
    content:"";position:absolute;inset:15px;border:3px double var(--red);opacity:.55;pointer-events:none;
  }
  .inner{position:relative;padding:22px 20px 6px}

  .platemark{
    position:absolute;top:24px;right:38px;font-size:1rem;letter-spacing:.2em;
    color:var(--faint);z-index:3;
  }

  /* ——— шапка ——— */
  .head{text-align:center;margin-bottom:6px}
  .zastavka{display:block;margin:0 auto 12px;max-width:100%}
  .masthead{
    font-size:clamp(2.3rem,6.4vw,4rem);font-weight:bold;letter-spacing:.18em;
    text-transform:uppercase;line-height:1;color:var(--ink);
  }
  .sub{
    display:inline-block;margin-top:8px;padding:3px 16px;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    font-size:.92rem;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);
  }

  /* ——— книга прихода ——— */
  .tally{display:flex;flex-wrap:wrap;margin:16px 0 4px;border:1px solid var(--ink)}
  .tally div{flex:1;min-width:130px;text-align:center;padding:13px 8px;border-right:1px solid var(--ink)}
  .tally div:last-child{border-right:none}
  .tally .lab{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .tally .num{font-size:2.1rem;font-weight:bold;margin-top:4px}
  .tally .num.red{color:var(--red)}

  /* ——— содержимое ——— */
  .year{font-size:1rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  .titlerow{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px}
  .titlerow h2{font-size:clamp(1.8rem,4.2vw,2.7rem);line-height:1.18;flex:1}
  .vign{flex-shrink:0;width:104px;height:104px;opacity:.9}

  .bukvica{float:left;width:88px;height:88px;margin:6px 18px 4px 0;shape-outside:margin-box}
  .sit{font-size:1.42rem;margin-bottom:15px;line-height:1.5}
  .sit:after{content:"";display:block;clear:none}
  .q{margin:26px 0 16px;font-style:italic;color:var(--red);font-size:1.5rem;clear:both}

  .opts{list-style:none;clear:both}
  .opt{
    border:1px solid var(--ink);background:rgba(255,255,255,.34);
    padding:16px 20px;margin-bottom:11px;cursor:pointer;font-size:1.34rem;
    display:flex;gap:14px;align-items:flex-start;transition:background .15s;
  }
  .opt .lit{
    flex-shrink:0;font-weight:bold;color:var(--red);width:30px;text-align:center;font-size:1.4rem;
    border-right:1px solid rgba(28,23,16,.25);align-self:stretch;
  }
  .opt:hover{background:rgba(167,40,32,.12)}
  .opt.chosen{background:rgba(189,140,44,.22);border-width:2px}
  .opt.dead{cursor:default;opacity:.55}
  .opt.dead:hover{background:rgba(255,255,255,.34)}

  .reveal{display:none;margin-top:22px}
  .reveal.on{display:block}
  .konec{display:block;margin:0 auto 18px;width:200px}
  .verdict{font-size:1rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;text-align:center}
  .verdict.hit{color:var(--teal)}
  .verdict.miss{color:var(--red)}
  .reveal p{margin-bottom:14px;font-size:1.4rem;line-height:1.5}
  .src{font-size:1.05rem;color:var(--faint);font-style:italic}
  blockquote{border-left:4px solid var(--red);padding-left:22px;margin:18px 0;font-size:1.4rem;line-height:1.5}

  .next{
    display:block;margin:26px auto 0;padding:16px 44px;
    background:var(--ink);color:var(--plate);border:none;cursor:pointer;
    font-family:inherit;font-size:1.02rem;letter-spacing:.22em;text-transform:uppercase;
  }
  .next:hover{background:var(--red)}

  .ledger{border:1px solid var(--ink);padding:4px 18px;margin:18px 0}
  .attestat{border:1px solid var(--ink);background:rgba(167,40,32,.05);padding:18px 22px;margin:20px 0;
            display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
  .portret{flex-shrink:0;width:210px}
  .portret svg{display:block;width:100%;border:1px solid var(--ink)}
  .portret .pod{font-size:.92rem;color:var(--faint);font-style:italic;text-align:center;padding-top:8px;line-height:1.35}
  .attcol{flex:1;min-width:300px}
  .attestat .h{font-size:.92rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);
               padding:0 0 8px;border-bottom:1px solid rgba(28,23,16,.3)}
  .attestat div.r{display:flex;gap:18px;padding:11px 0;font-size:1.28rem;border-bottom:1px dotted rgba(28,23,16,.28)}
  .attestat div.r:last-child{border-bottom:none}
  .attestat .k{flex-shrink:0;width:34%;color:var(--faint)}
  .ledger div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:1.35rem;border-bottom:1px dotted rgba(28,23,16,.3)}
  .ledger div:last-child{border-bottom:none}
  .ledger b{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="plate">
    <div class="platemark" id="mark"></div>
    <div class="inner">

      <div class="head">
        <svg class="zastavka" viewBox="0 0 680 58" width="560" height="48" aria-hidden="true">
          <defs>

      <div id="stage"></div>

  </div>
</div>

<script>
/* ——— орнаменты ——— */
const BUKV = (ch) => `<svg class="bukvica" viewBox="0 0 62 62" aria-hidden="true">
  <rect x="1" y="1" width="60" height="60" fill="#a72820"/>

const KONEC = `<svg class="konec" viewBox="0 0 150 34" aria-hidden="true">

  <path d="M75 30 C75 22, 60 22, 60 14 C60 8, 69 7, 75 13 C81 7, 90 8, 90 14 C90 22, 75 22, 75 30"

  <circle cx="75" cy="9" r="2.8" fill="#bd8c2c"/>

</svg>`;

const V = {
  pushka:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">
    <path d="M10 44 H54 L60 38 H66"/><path d="M10 44 L14 52 H50 L54 44"/>

  kniga:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">

    <path d="M16 26 H30 M16 34 H30 M44 26 H58 M44 34 H58" stroke="#a72820" stroke-width="1.2"/>
    <circle cx="37" cy="12" r="3" fill="#bd8c2c"/></svg>`,
  merkuriy:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">
    <path d="M37 60 V22"/><circle cx="37" cy="16" r="6"/>
    <path d="M25 30 C31 26, 43 26, 49 30"/>
    <path d="M22 18 C16 12, 16 22, 24 22" fill="#bd8c2c" stroke="#bd8c2c"/>

  litery:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">

    <text x="22" y="36" font-family="Georgia,serif" font-size="18" text-anchor="middle" fill="#a72820">А</text>
    <text x="52" y="36" font-family="Georgia,serif" font-size="18" text-anchor="middle" fill="#bd8c2c">Б</text></svg>`,
  denga:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">
    <circle cx="28" cy="34" r="17"/><circle cx="46" cy="44" r="17"/></g>
    <circle cx="28" cy="34" r="9" fill="#bd8c2c" opacity=".55"/>
    <circle cx="46" cy="44" r="9" fill="#a72820" opacity=".5"/></svg>`,
  pero:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">

  koleso:`<svg class="vign" viewBox="0 0 74 74"><g fill="none" stroke="#1c1710" stroke-width="1.6">

};

/* ——— кейсы ——— */
const CASES = [
  { year:"Декабрь 1702", title:"Указ подписан", v:"kniga",
    sit:["Пятнадцатого декабря государь подписал указ печатать «Ведомости» для извещения «о заграничных и внутренних происшествиях» всех русских людей. Газете велено «продаваться в мир по надлежащей цене».",
      "Приказы обязаны слать сведения о своей деятельности в Монастырский приказ Мусину-Пушкину, а тот без промедления — на Печатный двор. Шестнадцатого декабря указ напечатан. Семнадцатого готов первый номер.",
      "Дело новое, и как оно пойдёт — неведомо."],
    q:"Сколько оттискивать",
    opts:[{t:"Малое число, поглядеть, что выйдет",p:40,s:20},
          {t:"Три сотни — разослать по приказам и воеводам",p:300,s:60},
          {t:"Тысячу, чтобы сразу вся Москва прочла",p:1000,s:90}],
    right:0,
    real:["Первый номер носил пробный характер и был оттиснут в небольшом числе экземпляров.",
      "В печатном виде он не сохранился вовсе. Известен только по рукописным копиям."],
    src:"А. В. Западов" },

  { year:"27 декабря 1702", title:"Осада Нотебурга", v:"korabl",
    sit:["Через десять дней готов следующий номер — описание осады крепости Нотебург, взятой в сентябре.",
      "Постоянного заглавия у издания нет. Всякий выпуск можно озаглавить по-своему."],
    q:"Как назвать номер",
    opts:[{t:"«Ведомости», как сказано в указе"},
      {t:"«Юрнал или поденная роспись, что в мимошедшую осаду под крепостью Нотебурхом чинилось»"},
      {t:"«Подлинное доношение о взятии крепости Нотебурха, учинённое сего декабря»"}],
    right:1,
    real:["Номер вышел под названием «Юрнал или поденная роспись, что в мимошедшую осаду под крепостью Нотебурхом чинилось сентября с 26 числа в 1702 году».",
      "Третий вариант выбран не случайно: такие заглавия у газеты тоже бывали. Отдельные номера выходили как «Ведомости Московского государства», «Ведомости Московские», «Российские ведомости», а иногда заглавием становилось название напечатанного документа — «Подлинное доношение», «Реляция». Постоянного наименования у петровских «Ведомостей» так и не появилось."],
    src:"А. В. Западов", p:150, s:60 },

  { year:"2 января 1703", title:"Первое сообщение номера", v:"pushka",
    sit:["После Нарвы армия лишилась артиллерии, и на Пушечный двор свозят церковные колокола. Ныне вылито четыреста пушек, гаубиц и мортир, а меди на дворе больше сорока тысяч пудов.",
      "Если это напечатать, будут названы точное число орудий и запасы металла."],
    q:"Ставить ли это в номер",
    opts:[{t:"Нет. Это военная тайна, шведы прочтут"},
      {t:"Да, но без чисел — сказать, что льют исправно"},
      {t:"Да, первым сообщением, с числами"}],
    right:2,
    real:["Сообщение поставили первым, с числами. Государь участвовал в составлении номера и секретность сознавал, но решился разгласить.",
      "Причин было несколько. Вдохнуть бодрость в приунывших после Нарвы офицеров и солдат. Публично оправдать снятие церковных колоколов — меру, задевшую чувства верующих. Дать знать за границей, как быстро Россия восстанавливает вооружение. И заставить шведскую армию поостеречься."],
    quote:"«На Москве вновь ныне пушек медных гоубиц и мартиров вылито 400. Те пушки ядром по 24, по 18 и по 12 фунтов… А меди ныне на Пушечном дворе, которая приготовлена к новому литью, больше 40 000 пуд лежит».",
    src:"А. В. Западов", p:200, s:90 },

  { year:"2 января 1703", title:"Чем заполнить номер", v:"kolokol",
    sit:["Из приказов пришли разные сведения, а места в номере ещё остаётся."],
    q:"Что взять",
    opts:[{t:"Только военное. Прочее не дело газеты"},
      {t:"Школы, число рождённых, найденную под Казанью нефть и слона от индийского царя"},
      {t:"Цены на торгу, пожары и городские происшествия"}],
    right:1,
    real:["В номер вошли: «школы умножаются, и 45 человек слушают философию»; в штурманской школе «больше 300 человек учатся и добре науку приемлют»; в Москве за месяц «родилось мужеска и женска полу 386 человек»; на реке Соку нашли нефть и медную руду; индийский царь послал в дар слона.",

    src:"А. В. Западов", p:200, s:90 },

  { year:"1703", title:"Чем набирать", v:"litery",
    sit:["На Печатном дворе есть церковный шрифт — тот, которым набирают богослужебные книги. Читать его свободно умеет тот, кто учился по Псалтири."],
    q:"Чем набирать газету",
    opts:[{t:"Церковным — иного и нет"},{t:"Заказать особый шрифт попроще"},{t:"Латиницей, как в европейских газетах"}],
    right:0,
    real:["В первые годы издания «Ведомости» набирались церковным шрифтом. Иного на дворе не было.",

    src:"А. В. Западов", p:250, s:110 },

  { year:"1704, 22 августа, № 22", title:"Чужие слова", v:"pero",
    sit:["В сводке с театра военных действий стоят слова, которых русский читатель не знает: шамад, окорд, пардон."],
    q:"Что с ними делать",
    opts:[{t:"Оставить как есть — кому надобно, поймёт"},{t:"Заменить русскими словами"},

      <div class="attcol">
      <div class="h">Аттестат</div>
      <div class="r"><span class="k">Имя</span><span>Афанасий Иванов сын Хлебников, двадцати четырёх лет</span></div>
      <div class="r"><span class="k">Чин</span><span>Подьячий Приказа книг Печатного двора</span></div>
      <div class="r"><span class="k">Отец</span><span>Иван Хлебников, подьячий Монастырского приказа, ныне в отставке</span></div>
      <div class="r"><span class="k">Учение</span><span>Типографская школа при Печатном дворе. Грамоту греческую разумеет, латынь знает худо, но разбирает</span></div>
      <div class="r"><span class="k">На дворе с</span><span>1700 года, при справке книг и переводах</span></div>
      <div class="r"><span class="k">Ныне приставлен</span><span>К новому делу — к «Ведомостям», в помощь Фёдору Поликарпову</span></div>
      </div>
    </div>

    <p class="sit">Начальник твой — Фёдор Поликарпович Поликарпов, по званию справщик, а по указу государя от ноября прошлого года ещё и начальник всего Приказа книг Печатного двора. Человек он для Москвы редкий: учился в типографской школе, потом девять лет в Славяно-греко-латинской академии у братьев Лихудов, там же после преподавал грамматику, риторику и пиитику на греческом языке. В прошлом году вышел его «Букварь», ныне готовит славяно-греко-латинский «Лексикон». Пишет стихи.</p>

    <p class="sit">По званию справщика он правит и проверяет всё, что идёт в печать, и сам переводит; по званию начальника — заведует служащими и работниками, покупает бумагу и краску, ведёт ведомости о доходах. Газету он тоже будет вести: готовить материалы, обрабатывать переводы из иностранной печати, которые поставляет Посольский приказ, добывать известия из ведомств и канцелярий, следить за расположением заметок и держать корректуру. Ты при нём.</p>

    <p class="sit">Впереди двадцать пять лет. Решения принимаешь ты, а после смотришь, как было на самом деле. Оттиснутое и проданное пишется в книгу наверху.</p>

    <p class="src">Афанасий Хлебников вымышлен. Всё прочее — из документов.</p>
    <button class="next" onclick="show()">Начать</button>`;
}

function show(){
  if(i>=CASES.length) return final();
  const c=CASES[i];
  mark('Лист '+ROMAN[i]);
  const first=c.sit[0].charAt(0), rest=c.sit[0].slice(1);
  stage.innerHTML=`
    <div class="year">${c.year}</div>
    <div class="titlerow"><h2>${c.title}</h2>${V[c.v]||''}</div>
    ${BUKV(first)}
    <p class="sit">${rest}</p>
    ${c.sit.slice(1).map(s=>`<p class="sit">${s}</p>`).join('')}
    <div class="q">${c.q}</div>
    <ul class="opts">
      ${c.opts.map((o,n)=>`<li class="opt" data-n="${n}"><span class="lit">${'АБВГ'[n]}</span><span>${o.t}</span></li>`).join('')}
    </ul>
    <div class="reveal" id="rev"></div>`;
  document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>pick(+el.dataset.n)));
  window.scrollTo(0,0);
}

function pick(n){
  const c=CASES[i],o=c.opts[n];
  document.querySelectorAll('.opt').forEach(el=>{const cl=el.cloneNode(true);cl.classList.add('dead');el.replaceWith(cl)});
  document.querySelector(`.opt[data-n="${n}"]`).classList.add('chosen');
  answered++;
  const hit=n===c.right; if(hit)hits++;
  P+=(o.p!==undefined?o.p:(c.p||0));
  S+=(o.s!==undefined?o.s:(c.s||0));
  tally();
  const rev=document.getElementById('rev');
  rev.innerHTML=`${KONEC}
    <div class="verdict ${hit?'hit':'miss'}">${hit?'Так и было':'Было иначе'}</div>
    ${c.real.map(r=>`<p>${r}</p>`).join('')}
    ${c.quote?`<blockquote>${c.quote}</blockquote>`:''}
    <p class="src">${c.src}</p>
    <button class="next" onclick="i++;show()">Дальше</button>`;
  rev.classList.add('on');
  rev.scrollIntoView({behavior:'smooth',block:'start'});
}

function final(){
  const left=P-S, share=P?Math.round(left/P*100):0;
  mark('Итог');
  stage.innerHTML=`
    <div class="year">1727</div>
    <div class="titlerow"><h2>Газету передают Академии наук</h2>${V.kniga}</div>
    ${BUKV('Д')}
    <p class="sit">вадцать пять лет позади. Вот что вышло по твоей книге.</p>
    <div class="ledger">
      <div><span>Оттиснуто</span><b>${P.toLocaleString('ru-RU')}</b></div>
      <div><span>Продано</span><b>${S.toLocaleString('ru-RU')}</b></div>
      <div><span>Залежалось на дворе</span><b>${left.toLocaleString('ru-RU')} — ${share}%</b></div>
      <div><span>Решений сошлось с делом</span><b>${hits} из ${answered}</b></div>
    </div>
    <p class="sit">В 1728 году газета выходит уже под новым именем — «Санкт-Петербургские ведомости», и с этого времени она наконец выходит дважды в неделю в определённые дни, расходится не через лавку, а по подписке, когда человек платит вперёд и знает, когда придёт следующий номер, и печатается постоянным тиражом примерно в семьсот экземпляров.</p>
    ${KONEC}
    <blockquote>«Понадобилось много лет — добрые четверть века, — чтобы первая русская газета приобрела тип устойчивого, регулярного издания, какими стали с 1728 г. „Санкт-Петербургские ведомости“».</blockquote>
    <p class="src">А. В. Западов</p>
    <button class="next" onclick="i=0;hits=0;answered=0;P=0;S=0;tally();intro()">Сначала</button>`;
  window.scrollTo(0,0);
}

tally(); intro();
