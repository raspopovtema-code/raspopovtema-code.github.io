<style>
:root{--paper:#eef1f4;--ink:#17191e;--muted:#5c6370;--line:#d7dce3;--hot:#e3262e;--ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--display:"Rubik Mono One","Arial Black",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--ui)}[hidden]{display:none!important}
.wrap{max-width:1440px;margin:auto;padding:24px 24px 18px}header{display:flex;gap:16px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}h1{font:clamp(25px,3.5vw,46px)/1.15 var(--display);margin:0}h1 span{color:var(--hot)}.hint{margin:10px 0 0;color:var(--muted);font-size:14px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.button{font:600 14px/1.3 var(--ui);border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:11px 15px;cursor:pointer;text-decoration:none}.button.primary{background:var(--hot);border-color:var(--hot);color:#fff}.button:disabled{opacity:.45;cursor:default}.button:focus-visible,select:focus-visible{outline:3px solid #17191e;outline-offset:3px}.status{font-size:13px;color:var(--muted);margin:0 0 12px}.status:empty{display:none}.status.error{color:#a41720}
.map-stage{position:relative;width:100%;max-width:1120px;margin:0 auto;background:#fff;border-radius:20px;padding:12px;isolation:isolate}.map-canvas{display:block;width:100%;height:calc(100dvh - 205px);min-height:500px;max-height:1100px;border-radius:12px;background:#f7f8fa}
svg text{font-family:var(--ui);fill:var(--ink)}
svg .st{fill:none;stroke:#9AA2AE;stroke-width:3;stroke-linecap:round}
svg .pin circle{fill:var(--hot);stroke:#fff;stroke-width:3}
svg .pin .pn{fill:#fff;font-weight:700;font-size:16px;text-anchor:middle}
svg .pl{font-weight:600;font-size:16px}
svg .note{font-size:13.5px;fill:var(--muted)}
svg .big{font-weight:600;font-size:18px;fill:#5C6370}
svg .water{font-style:italic;font-size:14px;fill:#4C6F96}
svg .water.sm{font-size:12px}
svg .ring{font-size:13px;letter-spacing:1.5px;fill:#7A828E}
svg .sn{font-size:13.5px;fill:#5C6370}
svg .sn.red{fill:var(--hot);font-weight:700;font-size:15px}
svg .zm{font-family:var(--display);font-size:30px;fill:var(--hot);opacity:.85}
svg .metro circle{fill:#fff;stroke:#17191E;stroke-width:2}
svg .metro text{font-weight:700;font-size:11px;text-anchor:middle}
svg .mn{font-size:11px;fill:var(--muted)}
svg .pin{cursor:pointer;outline:none}svg .pin .pin-hit{fill:transparent;stroke:none}svg .pin:hover circle:not(.pin-hit),svg .pin:focus-visible circle:not(.pin-hit),svg .pin.active circle:not(.pin-hit){fill:#17191e;stroke-width:4}svg .pin .pn{pointer-events:none}
.place-select{display:none;width:100%;max-width:1120px;margin:0 auto 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:14px var(--ui)}
.quote-popup{position:absolute;z-index:5;width:390px;max-width:calc(100% - 20px);background:#fff;border:1px solid #e0e3e8;border-radius:15px;box-shadow:0 10px 40px #17191e29;overflow:hidden}.popup-head{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px}.point-number{display:inline-flex;align-items:center;justify-content:center;background:var(--hot);color:white;font-weight:700;border-radius:50%;width:27px;height:27px;flex:none}.popup-heading{min-width:0;flex:1}.popup-heading h2{font-size:17px;line-height:1.3;margin:2px 0 4px}.quote-count{font-size:12px;color:var(--muted)}.close{flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:#f1f3f5;color:var(--ink);border-radius:50%;font-size:22px;cursor:pointer}.close:focus-visible{outline:2px solid var(--hot)}
.popup-body{padding:0 18px 16px;max-height:min(470px,55dvh);overflow-y:auto;overscroll-behavior:contain}.popup-quotes{list-style:none;padding:0;margin:0}.popup-quotes li{padding:16px 0;border-top:1px solid #eceef1}.popup-quotes li:first-child{border-top:0;padding-top:6px}blockquote{margin:0 0 9px;padding:0 0 0 13px;border-left:3px solid var(--hot);font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}cite{font-size:13px;font-style:normal;color:var(--muted)}.empty{margin:8px 0 4px;color:var(--muted);font-size:14px}.popup-actions{padding:12px 18px;border-top:1px solid #eceef1}.popup-actions .button{width:100%}.stats{max-width:1120px;margin:12px auto 0;color:var(--muted);font-size:12px}
dialog{width:min(700px,calc(100% - 28px));max-height:90dvh;padding:0;border:0;border-radius:18px;background:#f7f8fa;color:var(--ink);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#17191e80}.editor-head{padding:22px 24px 16px;display:flex;gap:12px;align-items:flex-start;background:#fff}.editor-heading{flex:1}.editor-heading h2{font-size:21px;line-height:1.3;margin:0 0 7px}.editor-heading p{font-size:13px;color:var(--muted);margin:0}.editor-body{padding:18px 24px;max-height:58dvh;overflow-y:auto}.editor-rows{border:0;padding:0;margin:0;min-width:0}.edit-quote{background:#fff;border:1px solid #e0e3e8;border-radius:12px;padding:16px;margin-bottom:14px}.edit-row-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}.edit-row-head input{flex:1;min-width:0}.delete-quote{border:0;background:transparent;color:#9b2028;font:13px var(--ui);padding:8px;cursor:pointer}.edit-quote input,.edit-quote textarea{font:15px/1.45 var(--ui);padding:10px 11px;border:1px solid #cbd1da;border-radius:8px;background:#fff;color:var(--ink)}.edit-quote textarea{resize:vertical;min-height:105px;width:100%;display:block}.edit-quote input:focus,.edit-quote textarea:focus{outline:2px solid var(--hot);outline-offset:1px}.editor-foot{background:#fff;padding:16px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #e0e3e8}.editor-foot .primary{margin-left:auto}.editor-note{padding:0 24px 16px;margin:0;font-size:13px;color:var(--muted);background:#fff}.editor-note.error{color:#a41720}.editor-empty{color:var(--muted);font-size:14px;margin:0 0 16px}
@media(max-width:650px){.wrap{padding:18px 12px}.tools{gap:6px}.button{padding:10px 12px;font-size:13px}.map-stage{padding:7px;border-radius:14px}.map-canvas{height:auto;min-height:0;max-height:none}.place-select{display:block}.quote-popup{width:calc(100% - 16px);max-width:none;left:8px!important;top:8px!important}.popup-body{max-height:52dvh}.editor-head{padding:18px}.editor-body{padding:14px;max-height:53dvh}.editor-foot{padding:14px}.editor-note{padding:0 14px 14px}.edit-quote{padding:12px}h1{font-size:27px}.hint{font-size:13px}}
</style>
</head>

  <p id="map-stats" class="stats"></p>
</main>
<dialog id="quotes-editor" aria-labelledby="editor-title">
  <div class="editor-head"><div class="editor-heading"><h2 id="editor-title"></h2><p>Добавляй отдельную цитату для каждого фрагмента и указывай песню.</p></div><button id="editor-close" type="button" class="close" aria-label="Закрыть редактор">×</button></div>
  <div class="editor-body"><fieldset id="editor-rows" class="editor-rows"></fieldset><p id="editor-empty" class="editor-empty">Для этого места пока нет цитат.</p><button id="quote-add" class="button" type="button">+ Добавить цитату</button></div>
  <div class="editor-foot"><button id="editor-cancel" class="button" type="button">Отменить изменения точки</button><button id="editor-save" class="button primary" type="button" disabled>Сохранить</button></div>
  <p id="editor-note" class="editor-note" role="status" aria-live="polite"></p>
</dialog>
<noscript>Для загрузки цитат из таблицы включи JavaScript.</noscript>
<script>
window.GUF_MAP_CONFIG = {"bridge": false, "editor": false, "owner": false, "endpoint": "https://script.google.com/macros/s/AKfycbyKciwR-N7FI2R3XCLjaGuiNmvQYt5HYemu0o4O44zRq8L16oY_rlcQR0KPKBuxV-4/exec"};
const FALLBACK_POINTS = [{"id": 1, "place": "Пятницкая улица", "quotes": []}, {"id": 2, "place": "Новокузнецкая, 32 — граффити «Guf»", "quotes": []}, {"id": 3, "place": "Овчинниковская наб., 22/24 — дом бабушки и крыша", "quotes": []}, {"id": 4, "place": "«Макдональдс» у метро «Третьяковская»", "quotes": []}, {"id": 5, "place": "Трамвай: от Чистых прудов к Новокузнецкой и ниже", "quotes": []}, {"id": 6, "place": "Чистопрудный бульвар → Южное Бутово", "quotes": []}, {"id": 7, "place": "Ленинский проспект", "quotes": []}];
(function () {
  'use strict';
  const config = window.GUF_MAP_CONFIG || {};
  const $ = id => document.getElementById(id);
  const pins = Array.from(document.querySelectorAll('.pin[data-point]'));
  const popup = $('quote-popup');
  const stage = $('map-stage');
  const editor = $('quotes-editor');
  const rows = $('editor-rows');
  const canEdit = !!(config.bridge && config.editor && config.owner);
  const draftKey = 'moskva-gufa-quotes-list-draft-v1';
  const cacheKey = 'moskva-gufa-quotes-list-cache-v1:' + (config.endpoint || '');
  let points = JSON.parse(JSON.stringify(FALLBACK_POINTS));
  let remote = null;
  let loaded = false;
  let busy = false;
  let dirty = false;
  let active = null;
  let anchor = null;
  let pinned = false;
  let closeTimer = null;
  let editorId = null;
  let requestId = 0;

  const copy = value => JSON.parse(JSON.stringify(value));
  const plural = (n, one, few, many) => n + ' ' + (n % 100 >= 11 && n % 100 <= 14 ? many : n % 10 === 1 ? one : n % 10 >= 2 && n % 10 <= 4 ? few : many);
  const point = id => points.find(item => item.id === Number(id));
  const editable = list => list.map(item => ({id:item.id,quotes:item.quotes.map(quote => ({id:quote.id,track:quote.track,text:quote.text}))}));
  function message(text, error) {
    [$('map-status'), $('editor-note')].forEach(node => { node.textContent = text; node.classList.toggle('error',!!error); });
  }
  function validate(data) {
    if (!data || typeof data.revision !== 'string' || !Array.isArray(data.items) || data.items.length !== 7) throw new Error('Получен неполный список мест.');
    const ids = new Set(), quoteIds = new Set();
    data.items.forEach(item => {
      if (!item || !Number.isInteger(item.id) || item.id < 1 || item.id > 7 || ids.has(item.id) || !Array.isArray(item.quotes)) throw new Error('Обнови страницу карты, чтобы загрузить списки цитат.');
      ids.add(item.id);
      item.quotes.forEach(quote => {
        if (!quote || typeof quote.id !== 'string' || quoteIds.has(quote.id) || typeof quote.track !== 'string' || typeof quote.text !== 'string') throw new Error('Не удалось прочитать одну из цитат.');
        quoteIds.add(quote.id);
      });
    });
    return data;
  }
  function normalize(data) {
    return data.items.map(item => ({id:item.id,place:item.place || point(item.id).place,quotes:item.quotes.map(quote => ({id:quote.id,track:quote.track,text:quote.text}))})).sort((a,b)=>a.id-b.id);
  }
  function readDraft() { try { return JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch (_) { return null; } }
  function checkDraft() {
    const draft = readDraft();
    $('map-restore').hidden = !(canEdit && draft && Array.isArray(draft.items) && draft.items.length === 7);
  }
  function stash() {
    try { localStorage.setItem(draftKey,JSON.stringify({revision:remote && remote.revision,items:points})); } catch (_) {}
    checkDraft();
  }
  function setControls() {
    [$('map-save'),$('editor-save')].forEach(button => { button.disabled = busy || !dirty || !loaded; });
    $('map-cancel').disabled = busy || !dirty;
    $('map-refresh').disabled = busy;
    $('map-restore').disabled = busy || !loaded;
    rows.disabled = busy;
    $('quote-add').disabled = busy || !loaded;
    $('editor-cancel').disabled = busy;
    $('popup-edit').disabled = busy || !loaded;
  }
  function stats() {
    const count = points.reduce((sum,item)=>sum+item.quotes.filter(quote=>quote.text.trim()).length,0);
    $('map-stats').textContent = plural(points.length,'место','места','мест') + ' · ' + plural(count,'цитата','цитаты','цитат');
  }
  function changed() {
    dirty = !!remote && JSON.stringify(editable(points)) !== JSON.stringify(editable(remote.items));
    stash(); setControls(); stats();
    message(dirty ? 'Изменения пока не опубликованы.' : '');
    if (active !== null) { renderPopup(); positionPopup(); }
  }
  function apply(data) {
    validate(data);
    points = normalize(data);
    remote = {revision:data.revision,items:copy(points)};
    loaded = true; dirty = false;
    stats(); setControls();
    if (active !== null) { renderPopup(); positionPopup(); }
    if (editor.open) renderEditor();
  }

  function renderPopup() {
    const item = point(active);
    if (!item) return;
    $('popup-number').textContent = item.id;
    $('popup-place').textContent = item.place;
    const quotes = item.quotes.filter(quote=>quote.text.trim());
    $('popup-count').textContent = loaded ? plural(quotes.length,'цитата','цитаты','цитат') : '';
    const list = $('popup-quotes');
    list.replaceChildren();
    quotes.forEach(quote => {
      const entry = document.createElement('li');
      const text = document.createElement('blockquote');
      text.textContent = quote.text;
      entry.appendChild(text);
      if (quote.track.trim()) {
        const track = document.createElement('cite');
        track.textContent = quote.track;
        entry.appendChild(track);
      }
      list.appendChild(entry);
    });
    $('popup-empty').hidden = quotes.length > 0;
    $('popup-empty').textContent = loaded ? 'Цитаты для этого места пока не добавлены.' : 'Цитаты загружаются…';
    $('popup-actions').hidden = !canEdit;
    $('popup-edit').disabled = busy || !loaded;
    pins.forEach(pin => {
      const selected = Number(pin.dataset.point) === item.id;
      pin.classList.toggle('active',selected);
      pin.setAttribute('aria-expanded',String(selected && !popup.hidden));
    });
  }
  function positionPopup() {
    if (popup.hidden || !anchor || window.matchMedia('(max-width:650px)').matches) return;
    const box = stage.getBoundingClientRect();
    const pin = anchor.getBoundingClientRect();
    const width = popup.offsetWidth, height = popup.offsetHeight;
    let left = pin.right - box.left + 10;
    if (left + width > stage.clientWidth - 12) left = pin.left - box.left - width - 10;
    left = Math.max(12,Math.min(left,stage.clientWidth-width-12));
    const top = Math.max(12,Math.min(pin.top-box.top-16,stage.clientHeight-height-12));
    popup.style.left = left + 'px'; popup.style.top = top + 'px';
  }
  function openPopup(id,node,lock) {
    clearTimeout(closeTimer);
    if (pinned && !lock && active !== Number(id)) return;
    active = Number(id); anchor = node; if (lock) pinned = true;
    popup.hidden = false;
    renderPopup(); positionPopup();
  }
  function closePopup() {
    clearTimeout(closeTimer);
    popup.hidden = true; active = null; anchor = null; pinned = false;
    pins.forEach(pin => { pin.classList.remove('active'); pin.setAttribute('aria-expanded','false'); });
  }
  function scheduleClose() {
    clearTimeout(closeTimer);
    if (!pinned && !editor.open) closeTimer = setTimeout(closePopup,260);
  }
  pins.forEach(pin => {
    const id = Number(pin.dataset.point);
    pin.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch'&&!editor.open)openPopup(id,pin,false);});
    pin.addEventListener('pointerleave',scheduleClose);
    pin.addEventListener('focus',()=>{if(!editor.open)openPopup(id,pin,false);});
    pin.addEventListener('blur',event=>{if(!popup.contains(event.relatedTarget))scheduleClose();});
    pin.addEventListener('click',event=>{event.stopPropagation();if(canEdit)openEditor(id);else openPopup(id,pin,true);});
    pin.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();if(canEdit)openEditor(id);else openPopup(id,pin,true);}
    });
  });
  popup.addEventListener('pointerenter',()=>clearTimeout(closeTimer));
  popup.addEventListener('pointerleave',scheduleClose);
  popup.addEventListener('focusin',()=>clearTimeout(closeTimer));
  $('popup-close').addEventListener('click',closePopup);
  $('popup-edit').addEventListener('click',()=>openEditor(active));
  $('place-select').addEventListener('change',event=>{
    const id = Number(event.target.value); if(!id)return;
    const pin = pins.find(node=>Number(node.dataset.point)===id);
    if(canEdit)openEditor(id);else openPopup(id,pin,true);
  });
  document.addEventListener('pointerdown',event=>{
    if (!popup.hidden && !popup.contains(event.target) && !event.target.closest('.pin') && event.target!==$('place-select') && !editor.contains(event.target)) closePopup();
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!editor.open)closePopup();});
  window.addEventListener('resize',positionPopup);

  function renderEditor(focusId) {
    const item = point(editorId);
    if (!item) return;
    $('editor-title').textContent = item.place;
    rows.replaceChildren();
    $('editor-empty').hidden = item.quotes.length > 0;
    item.quotes.forEach((quote,index) => {
      const entry = document.createElement('div'); entry.className = 'edit-quote';
      const head = document.createElement('div'); head.className = 'edit-row-head';
      const track = document.createElement('input'); track.type = 'text'; track.placeholder = 'Название песни'; track.value = quote.track;
      track.setAttribute('aria-label','Песня ' + (index+1)); track.maxLength = 1000;
      const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'delete-quote'; remove.textContent = 'Удалить';
      remove.setAttribute('aria-label','Удалить цитату ' + (index+1));
      const text = document.createElement('textarea'); text.rows = 3; text.placeholder = 'Текст цитаты'; text.value = quote.text; text.maxLength = 15000;
      text.setAttribute('aria-label','Цитата ' + (index+1));
      track.addEventListener('input',()=>{quote.track=track.value;changed();});
      text.addEventListener('input',()=>{quote.text=text.value;changed();});
      remove.addEventListener('click',()=>{item.quotes=item.quotes.filter(value=>value.id!==quote.id);changed();renderEditor();});
      head.append(track,remove); entry.append(head,text); rows.appendChild(entry);
      if (focusId===quote.id) requestAnimationFrame(()=>{track.focus();entry.scrollIntoView({block:'nearest'});});
    });
    setControls();
  }
  function openEditor(id) {
    if (!canEdit || !loaded || busy) { if(canEdit)message('Дождись загрузки цитат.');return; }
    editorId = Number(id);
    closePopup();
    renderEditor();
    if(!editor.open)editor.showModal();
    $('editor-note').textContent = dirty ? 'Изменения пока не опубликованы.' : '';
  }
  $('quote-add').addEventListener('click',()=>{
    const item = point(editorId); if(!canEdit||busy||!item)return;
    const id = 'new-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2));
    item.quotes.push({id:id,track:'',text:''});
    changed(); renderEditor(id);
  });
  $('editor-close').addEventListener('click',()=>editor.close());
  $('editor-cancel').addEventListener('click',()=>{
    if(!remote||busy)return;
    point(editorId).quotes=copy(remote.items.find(item=>item.id===editorId).quotes);
    changed();renderEditor();
  });

  function rpc(method,args) {
    return new Promise((resolve,reject)=>{
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||'Google не подтвердил операцию.')));
      if(method==='saveMap')runner.saveMap(args);
      else if(method==='getEditorData')runner.getEditorData();
      else runner.getMapData();
    });
  }
  function publicData() {
    return new Promise((resolve,reject)=>{
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(config.endpoint||'')){reject(new Error('Подключение к таблице не настроено.'));return;}
      const name='gufMapCallback_'+Date.now()+'_'+(++requestId);
      const script=document.createElement('script');
      const timer=setTimeout(()=>{cleanup();reject(new Error('Таблица не ответила. Нажми «Обновить».'));},18000);
      function cleanup(){clearTimeout(timer);script.remove();delete window[name];}
      window[name]=data=>{cleanup();if(data&&data.error)reject(new Error(data.error));else resolve(data);};
      script.onerror=()=>{cleanup();reject(new Error('Не удалось связаться с таблицей.'));};
      script.src=config.endpoint+'?action=data&callback='+name;
      document.body.appendChild(script);
    });
  }
  async function load() {
    if(busy)return;busy=true;setControls();message('Загружаем цитаты…');
    try {
      const data=validate(await(config.bridge?rpc(canEdit?'getEditorData':'getMapData'):publicData()));
      apply(data);
      if(!canEdit)try{localStorage.setItem(cacheKey,JSON.stringify(data));}catch(_){}
      message(config.editor&&!canEdit?'Редактирование доступно владельцу карты. Открой редактор в его Google-аккаунте.':'');
      checkDraft();
    }catch(error){message(error.message+(!canEdit&&loaded?' Показана сохранённая версия.':''),true);}
    finally{busy=false;setControls();}
  }
  async function save() {
    if(!canEdit||busy||!dirty||!remote)return;
    for(const item of points)for(const quote of item.quotes){
      if(!quote.text.trim()&&quote.track.trim()){openEditor(item.id);message('Добавь текст к песне «'+quote.track+'».',true);return;}
    }
    stash();busy=true;setControls();message('Сохраняем цитаты…');
    try{
      const result=await rpc('saveMap',{revision:remote.revision,items:editable(points)});
      if(!result||!result.ok)throw new Error(result&&result.message||'Сохранение не подтверждено. Черновик остался в этом браузере.');
      apply(result.data);
      try{localStorage.removeItem(draftKey);}catch(_){}
      checkDraft();if(editor.open)editor.close();message('Сохранено. Цитаты опубликованы на карте.');
    }catch(error){message(error.message,true);}
    finally{busy=false;setControls();}
  }
  $('map-save').addEventListener('click',save);
  $('editor-save').addEventListener('click',save);
  $('map-cancel').addEventListener('click',()=>{
    if(!remote||busy||!window.confirm('Отменить неопубликованные изменения?'))return;
    apply(remote);
    try{localStorage.removeItem(draftKey);}catch(_){}
    checkDraft();message('Изменения отменены.');
  });
  $('map-refresh').addEventListener('click',()=>{
    if(dirty){stash();if(!window.confirm('Обновить цитаты из таблицы? Текущие изменения останутся в черновике этого браузера.'))return;}
    load();
  });
  $('map-restore').addEventListener('click',()=>{
    const draft=readDraft();if(!canEdit||busy||!loaded||!draft)return;
    if(!window.confirm('Восстановить черновик? Проверь его перед публикацией.'))return;
    try{
      validate({items:draft.items,revision:String(draft.revision||'')});
      points=normalize({items:draft.items});changed();
      if(editor.open)renderEditor();
      message('Черновик восстановлен. Проверь цитаты перед сохранением.');
    }catch(_){message('Не удалось прочитать черновик.',true);}
  });
  window.addEventListener('beforeunload',event=>{if(canEdit&&dirty){event.preventDefault();event.returnValue='';}});
  $('map-edit').hidden=!!config.editor||!config.endpoint;
  if(config.endpoint)$('map-edit').href=config.endpoint+'?page=edit';
  $('map-save').hidden=$('map-cancel').hidden=!canEdit;
  if(canEdit)$('map-hint').textContent='Нажми на точку, чтобы добавить или изменить её цитаты.';
  else if(window.matchMedia('(pointer:coarse)').matches)$('map-hint').textContent='Нажми на точку, чтобы увидеть все её цитаты.';
  if(!canEdit)try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cached)apply(cached);}catch(_){}
  stats();setControls();load();
})();


</script>
</body>
